services:
    app:
        build:
            context: ./docker/php
            args:
                UID: ${DOCKER_UID:-1000}
                GID: ${DOCKER_GID:-1000}
        image: software-license-manager-php
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
        environment:
            # Read only by the integration test mode (tests/integration-bootstrap.php).
            DB_TEST_DATABASE: ${DB_DATABASE}_testing
        depends_on:
            mysql:
                condition: service_healthy
            mysql-test-database:
                condition: service_completed_successfully
            redis:
                condition: service_healthy

    nginx:
        image: nginx:1.28-alpine
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        ports:
            - "${FORWARD_DB_PORT:-3306}:3306"
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
            interval: 5s
            timeout: 5s
            retries: 20

    # One-shot job, run on every `docker compose up`: makes sure the integration test
    # database exists (also on an existing mysql-data volume) and that the app user can use it.
    mysql-test-database:
        image: mysql:8.4
        restart: "no"
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            MYSQL_PWD: ${DB_ROOT_PASSWORD:-root}
        # On a fresh volume the healthcheck can pass on MySQL's temporary init server (no TCP),
        # so wait until it accepts TCP connections before creating the database.
        entrypoint: ["sh", "-c"]
        command:
            - |
                for attempt in $$(seq 60); do mysqladmin ping --host=mysql --user=root --silent && break; sleep 1; done
                mysql --host=mysql --user=root --execute="CREATE DATABASE IF NOT EXISTS \`${DB_DATABASE}_testing\`; GRANT ALL PRIVILEGES ON \`${DB_DATABASE}_testing\`.* TO '${DB_USERNAME}'@'%';"

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    mysql-data:
    redis-data:
